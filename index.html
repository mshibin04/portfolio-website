<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <title>Shibin | Developer Portfolio</title>
</head>
<body>
    <header>
        <a href="#" class="logo">Shibin</a>
        <nav>
            <a href="#" class="active">Home</a>
        </nav>
    </header>

    <section class="home">
        <div class="developer-cluster" role="img" aria-label="Developer tools: code, terminal, Python, Git, and GitHub">
            <i class="fa-solid fa-code developer-core" aria-hidden="true"></i>
            <i class="fa-solid fa-terminal tool-icon terminal" aria-hidden="true"></i>
            <i class="fa-brands fa-python tool-icon python" aria-hidden="true"></i>
            <i class="fa-brands fa-git-alt tool-icon git" aria-hidden="true"></i>
            <i class="fa-brands fa-github tool-icon github" aria-hidden="true"></i>
            <span class="star star-one" aria-hidden="true">&starf;</span>
            <span class="star star-two" aria-hidden="true">&starf;</span>
            <span class="star star-three" aria-hidden="true">&starf;</span>
        </div>

        <div class="home-content">
            <h1>Hi, It's <span>Shibin</span></h1>
            <h3 class="typing-text">I'm a <span></span></h3>
            <p>I'm a student and aspiring Python developer who enjoys turning ideas into working projects. Right now, I'm learning by building, experimenting, and getting a little better with every project.</p>
            <div class="social-icons">
                <a href="https://github.com/mshibin04" target="_blank" rel="noreferrer" aria-label="Visit Shibin's GitHub profile">
                    <i class="fa-brands fa-github" aria-hidden="true"></i>
                </a>
            </div>
            <a href="#" class="btn">Thanks for reading</a>
        </div>
    </section>
</body>
</html>
